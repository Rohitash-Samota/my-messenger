services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: my-messenger
      MONGO_INITDB_ROOT_PASSWORD: 1860b81c60f134d81a55ffc6c7ec97a4
      MONGO_INITDB_ROOT_USERNAME: avas
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: my-messenger
      MYSQL_USER: avas
      MYSQL_PASSWORD: avas_local
      MYSQL_ROOT_PASSWORD: avas_root_local
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    ports:
      - '8081:8080'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    depends_on:
      - redis
    ports:
      - '5540:5540'
    volumes:
      - redisinsight-data:/data

volumes:
  mongodb-data:
  mysql-data:
  kafka-data:
  redis-data:
  redisinsight-data: