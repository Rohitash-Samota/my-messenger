spring.application.name=my-messenger
app.jwt.secret=${JWT_SECRET:bXktbWVzc2VuZ2VyLWRldi1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/my_messenger}
spring.datasource.username=${DB_USERNAME:avas}
spring.datasource.password=${DB_PASSWORD:avas_local}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://avas:1860b81c60f134d81a55ffc6c7ec97a4@localhost:27017/my_messenger?authSource=admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Kafka uses String keys and JSON envelope strings. Every deployment of the same
# consumer role should share a group id; individual listeners may override it.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=${KAFKA_CLIENT_ID:my-messenger}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:10}
spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:zstd}
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:25000}
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:10000}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:my-messenger-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.isolation-level=read-committed
spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:100}
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=true
spring.kafka.admin.fail-fast=${KAFKA_ADMIN_FAIL_FAST:true}

app.kafka.topics.create=${KAFKA_CREATE_TOPICS:true}
app.kafka.topics.partitions=${KAFKA_TOPIC_PARTITIONS:6}
app.kafka.topics.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}
app.kafka.topics.min-in-sync-replicas=${KAFKA_TOPIC_MIN_ISR:1}
app.kafka.topics.retention-ms=${KAFKA_TOPIC_RETENTION_MS:604800000}
app.kafka.topics.dlt-retention-ms=${KAFKA_DLT_RETENTION_MS:2592000000}
app.kafka.retry.max-attempts=${KAFKA_CONSUMER_MAX_ATTEMPTS:4}
app.kafka.retry.initial-interval-ms=${KAFKA_CONSUMER_RETRY_INITIAL_MS:1000}
app.kafka.retry.multiplier=${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-interval-ms=${KAFKA_CONSUMER_RETRY_MAX_MS:10000}
app.kafka.consumer-groups.notification-fanout=${KAFKA_NOTIFICATION_FANOUT_GROUP:notification-fanout-v1}
app.kafka.consumer-groups.in-app-notification=${KAFKA_IN_APP_NOTIFICATION_GROUP:in-app-notification-v1}

app.outbox.relay-enabled=${OUTBOX_RELAY_ENABLED:true}
app.outbox.instance-id=${OUTBOX_RELAY_INSTANCE_ID:${HOSTNAME:local}}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:500}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
app.outbox.lease-ms=${OUTBOX_LEASE_MS:120000}
app.outbox.send-timeout-ms=${OUTBOX_SEND_TIMEOUT_MS:30000}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
app.outbox.retry-initial-ms=${OUTBOX_RETRY_INITIAL_MS:1000}
app.outbox.retry-max-ms=${OUTBOX_RETRY_MAX_MS:300000}
app.outbox.retry-multiplier=${OUTBOX_RETRY_MULTIPLIER:2.0}

# Enable Flyway (scripts will live in src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html

# WebRTC call signaling uses authenticated STOMP frames over this WebSocket.
# Keep production origins explicit and serve the endpoint through TLS (wss://).
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

# Browser/API origins are comma-separated. Media stays on this server's local
# disk; production deployments should mount MEDIA_STORAGE_PATH persistently.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.media.storage-path=${MEDIA_STORAGE_PATH:./local-media}
app.media.max-image-bytes=${MEDIA_MAX_IMAGE_BYTES:10485760}
app.media.max-video-bytes=${MEDIA_MAX_VIDEO_BYTES:104857600}
app.media.max-audio-bytes=${MEDIA_MAX_AUDIO_BYTES:26214400}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:101MB}
